name: alpha-impact

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: alfa
      POSTGRES_DB: alfa
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa"]
      interval: 5s
      timeout: 3s
      retries: 12

  db_test:
    image: pgvector/pgvector:pg16
    profiles: ["test"]
    environment:
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: alfa
      POSTGRES_DB: alfa_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa_test"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./backend
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      DB_URL: postgresql+asyncpg://alfa:alfa@db:5432/alfa
      METRICS_PORT: "9000"
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend/data/raw:/app/data/raw:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  front:
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

  seed:
    build:
      context: ./backend
    profiles: ["seed"]
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      DB_URL: postgresql+asyncpg://alfa:alfa@db:5432/alfa
    command: python -m scripts.seed
    volumes:
      - ./backend/data/raw:/app/data/raw:ro
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.5.0
    profiles: ["monitoring"]
    command: ["-config.file=/etc/loki/local-config.yaml", "-reporting.enabled=false"]
    volumes:
      - lokidata:/loki

  alloy:
    image: grafana/alloy:v1.10.0
    profiles: ["monitoring"]
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["monitoring"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/alpha-impact.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  dbdata:
  prometheusdata:
  lokidata:
  alloydata:
