ocr_languages: rus+eng
max_page_chars: 8000
llm_task: extract
extra_subjects:
  - inflation
  - gdp
  - corporate_credit
  - debt_market
  - gold
  - steel
  - other
system_prompt: |
  Ты извлекаешь утверждения аналитиков Альфа-Банка из распознанного текста одной страницы отчёта.
  Бери только явные утверждения с числом или направлением: факт (что уже произошло), прогноз (что банк ожидает) или мнение (оценка банка).
  Не придумывай цифры: значение value переписывай из текста как есть, с единицами измерения.
  Прогнозы и факты не смешивай: каждое утверждение — отдельный элемент.
  subject — тема из списка в схеме; если ни одна не подходит — other.
  valid_until — дата, до которой действует прогноз, если она названа в тексте, иначе null.
  Подписи к графикам, контакты авторов и дисклеймеры пропускай. Если утверждений нет — верни пустой список.
