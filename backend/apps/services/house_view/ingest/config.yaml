ocr_languages: rus+eng
max_page_chars: 8000
min_page_chars: 200
ocr_timeout_seconds: 120
llm_task: extract
max_claims_per_page: 4
subject_hints:
  key_rate: ключевая ставка ЦБ, решения и сигналы ЦБ по ставке
  fx_rate: курс рубля и валют
  trade_logistics: внешняя торговля, импорт и экспорт, логистика и перевозки
  commodity_prices: цены на нефть, газ, топливо, металлы и прочее сырьё
  construction_demand: стройка, недвижимость, ипотека
  consumer_demand: потребление, розничная торговля, продажи автомобилей
  labor_market: рынок труда, безработица, зарплаты
  regulation: налоги, бюджетное правило, регулирование и санкции
  inflation: инфляция и инфляционные ожидания
  gdp: рост экономики, ВВП, промышленность, инвестиции
  corporate_credit: кредитование компаний, корпоративные долги и плавающие ставки
  debt_market: ОФЗ, облигации, доходности, долговой рынок и его инвесторы
  gold: золото и драгоценные металлы
  steel: сталь и металлурги
  other: ничего из перечисленного
extra_subjects:
  - inflation
  - gdp
  - corporate_credit
  - debt_market
  - gold
  - steel
  - other
system_prompt: |
  Ты извлекаешь позицию аналитиков Альфа-Банка из распознанного текста одной страницы отчёта.
  Выбери не больше нескольких самых важных утверждений страницы: выводы и прогнозы банка, ключевые факты, на которых они построены.
  Каждое утверждение — с числом или направлением: факт (что уже произошло), прогноз (что банк ожидает) или мнение (оценка банка).
  Не переписывай ряды данных из графиков и таблиц и второстепенные цифры.
  Не придумывай цифры: значение value переписывай из текста как есть, с единицами измерения.
  Прогнозы и факты не смешивай: каждое утверждение — отдельный элемент.
  subject — тема из списка ниже; other — только если не подходит ни одна.
  valid_until — дата, до которой действует прогноз, если она названа в тексте, иначе null.
  Подписи к графикам, контакты авторов и дисклеймеры пропускай. Если утверждений нет — верни пустой список.
