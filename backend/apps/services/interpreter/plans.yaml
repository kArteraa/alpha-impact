lookback_days: 14
search_limit: 200
feed_cards: 8
feed_search_limit: 1000
max_tool_calls: 4
max_title_chars: 200
trace_summary_chars: 1000
followup_focus: Ответ на вопрос пользователя к карточке с опорой на её источники и актуальную позицию банка
max_question_chars: 1000
max_followup_depth: 5
min_quote_words: 3
loan_horizon_months: 12
templates:
  payment:
    focus: Сроки поставки и тарифы получателя платежа; связь с отраслью и долей в оттоке клиента
    context: [profile, counterparty, news, house_view]
    house_view_subjects: []
  deposit:
    focus: Влияние событий и позиции банка по ставке на сумму и срок размещения
    context: [profile, news, house_view]
    house_view_subjects: [key_rate]
  fx:
    focus: Влияние валютных и внешнеторговых событий на будущий платёж
    context: [profile, news, house_view]
    house_view_subjects: []
  loan:
    focus: Условия финансирования и чувствительность клиента к ставке
    context: [profile, news, house_view]
    house_view_subjects: [key_rate]
  payroll:
    focus: События рынка труда и последствия для фонда оплаты труда
    context: [profile, news, house_view]
    house_view_subjects: []
  dashboard:
    focus: Значимость событий для компании и её текущих экспозиций
    context: [profile, news, house_view]
    house_view_subjects: []
  page:
    focus: Значимость вставленной новости для компании и её текущих экспозиций
    context: [profile, news, house_view]
    house_view_subjects: []
