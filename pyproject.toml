[project]
name = "alfa-insight"
version = "0.1.0"
description = "Аналитика в момент действия — сервис внутри Альфа-Бизнеса"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "pgvector",
    "httpx",
    "pyyaml",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "import-linter",
    "httpx",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["shared/db/migrations/versions", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disable_error_code = ["type-abstract"]
warn_unused_configs = true
exclude = ['^\.venv/', '^node_modules/', '^apps/front/']

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]

[tool.importlinter]
root_packages = ["apps", "shared"]
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
name = "Services never import each other"
type = "independence"
modules = [
    "apps.services.gateway",
    "apps.services.profile",
    "apps.services.counterparty",
    "apps.services.news",
    "apps.services.house_view",
    "apps.services.interpreter",
    "apps.services.whatif",
    "apps.services.products",
    "apps.services.llm",
    "apps.services.trace",
]

[[tool.importlinter.contracts]]
name = "Services may import only shared.contracts, shared.config, shared.db and the DI container"
type = "forbidden"
source_modules = ["apps.services"]
forbidden_modules = ["shared.di.wiring", "shared.db.migrations"]

[[tool.importlinter.contracts]]
name = "shared never depends on services"
type = "layers"
layers = ["apps.services", "shared"]
ignore_imports = ["shared.di.wiring -> apps.services.*"]
