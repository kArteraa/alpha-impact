description = "Выполнить задачу бэклога AH-<n> по пайплайну проекта: ветка, план, TDD, коммиты, чистка, верификация, ревью, ручная проверка, PR в dev"
prompt = """
Выполни задачу проекта alfa-insight по пайплайну. Аргументы пользователя: {{args}}

Источник правил — GEMINI.md (зеркало CLAUDE.md); шаги с чек-листами — docs/PIPELINE.md; задачи — docs/tasks/BACKLOG.md.

1. Найди в аргументах ключ AH-<n>. Если ключа нет — считай текст описанием задачи и задай ОДИН вопрос: добавить ли её в бэклог сначала.
2. Прочитай блок задачи в docs/tasks/BACKLOG.md: эпик, день, тип, «Зависит от», «Что сделать», «Готово, когда». Если зависимость не закрыта — скажи и спроси, продолжать ли.
3. Объяви одной строкой: ключ, тип, имя ветки (<тип>/AH-<n>-<slug>, slug — английский kebab-case из 2–4 слов; для contract — feat/AH-<n>-contract-<slug>; для docs/chore — docs/… или chore/…).
4. Ветка: git switch dev && git pull && git switch -c <ветка>. Если рабочее дерево грязное — остановись и спроси.
5. План: файлы, тесты, затронутые контракты, риски, критерии приёмки из «Готово, когда». ОСТАНОВИСЬ и жди одобрения. (Для docs/chore план и TDD пропускаются.)
6. TDD: сначала тесты и показ, что они падают (make test / Vitest), потом код до зелёного. Для чистой JSX-вёрстки — render-тест и npm run build.
7. Коммит: естественный язык, списком, без префиксов и без упоминания агента.
8. Чистка по чек-листу из docs/PIPELINE.md: не больше 500 строк на файл, без комментариев, ничего сверх плана, без неодобренных дефолтов и фолбэков. Коммит, если что-то изменилось.
9. Верификация: make check (ruff, mypy, import-linter, pytest, npm test, npm run build) до зелёного. Коммит, если были правки.
10. Ревью по чек-листу из docs/PIPELINE.md (границы импортов, контракты не тронуты, у каждого Claim есть source_ref, нет чужих идентификаторов контрагентов, LLM только через сервис llm, THIRD_PARTY_NOTICES). Правки, снова make check. ОСТАНОВИСЬ: попроси ручную проверку того, что тесты не покрывают.
11. Коммит.
12. ОСТАНОВИСЬ: спроси разрешение на push. На «да»: git push -u origin <ветка>; gh pr create --base dev --title "AH-<n> · <название>"; описание: что сделано / как проверить («Готово, когда» как чек-лист) / риски.

Правила: никогда не коммитить в dev и main; контракты в shared/contracts меняются только задачей типа contract; если тесты падают — чинить до перехода к следующему шагу; если шаг невозможен — остановиться и сказать, что именно; никаких инструментов сверх git, gh, make, uv, npm без просьбы.
"""
