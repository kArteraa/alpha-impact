name: frontend

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run gen:types
      - run: git diff --exit-code -- app-plugin/src/types
      - run: npm run build
      - run: npm test
