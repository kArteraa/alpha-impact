name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alfa
          POSTGRES_PASSWORD: alfa
          POSTGRES_DB: alfa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alfa -d alfa_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DB_URL: postgresql+asyncpg://alfa:alfa@localhost:5432/alfa_test
      TEST_DB_URL: postgresql+asyncpg://alfa:alfa@localhost:5432/alfa_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --frozen
      - run: cp .env.example .env
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict shared
      - run: uv run mypy apps main.py scripts tests
      - run: uv run lint-imports
      - run: uv run pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run gen:types
      - run: git diff --exit-code -- apps/front/app-plugin/src/types
      - run: npm run build
      - run: npm test
